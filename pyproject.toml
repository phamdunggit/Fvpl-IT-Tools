[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fvpl-ittools"
description = "Công cụ IT: cài máy mới, join domain, sửa lỗi thường gặp, tối ưu Windows"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    # Qt 6.12 is the last release that supports Windows 10 (doc.qt.io/qt-6/windows.html). Do not lift the cap
    # while Win10 machines are still supported; tests/test_win10.py checks the installed version.
    "PySide6>=6.7,<6.13",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
]

[project.gui-scripts]
fvpl-ittools = "fvpl_ittools.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fvpl_ittools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fvpl_ittools = ["data/**/*.yaml", "data/**/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
