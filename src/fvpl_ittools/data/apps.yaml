# Danh mục phần mềm MẶC ĐỊNH, đóng gói kèm tool. Cách khai báo: docs/SOFTWARE.md.
#
# Bản thật của công ty đặt ở <share_root>\config\apps.yaml (share_root khai báo trong site.yaml). Tool đọc
# bản trên share trước, không vào được share mới dùng file này. Danh sách dưới là gợi ý ở PLAN.md mục 5.5,
# chưa chốt; phần mềm riêng của công ty (kế toán, hoá đơn, chữ ký số) khai báo trong bản trên share.
#
# Ứng dụng nguồn "share" chỉ chạy được khi đã có share_root và đúng đường dẫn bộ cài.

apps:
  # ---- Trình duyệt
  - id: chrome
    name: Google Chrome
    group: Trình duyệt
    source: winget
    winget_id: Google.Chrome
  - id: firefox
    name: Mozilla Firefox
    group: Trình duyệt
    source: winget
    winget_id: Mozilla.Firefox

  # ---- Văn phòng: Office (choice: office → trang Phần mềm hiện thành thẻ chọn một bản)
  # Bản volume cài thẳng từ ISO trong kho bộ cài, key MAK nằm trong file XML của kho (không bao giờ ở đây).
  - id: office2016
    name: Microsoft Office Standard 2016 (64-bit)
    group: Văn phòng
    choice: office
    source: share
    installer: '{share}\SW_DVD5_Office_2016_64Bit_English_MLF_X20-42479.ISO'
    args: '/config "{share}\config\office\office2016-standard.xml"'
    detect: { uninstall_name: 'Microsoft Office Standard 2016*' }
    conflicts: 'Microsoft 365*|Microsoft Office 365*|Microsoft Office Home*|Microsoft Office Professional*|Microsoft Office Standard 2013*|Microsoft Office Standard 2010*'
    timeout: 3600
    description: >
      Bản mặc định cho máy mới. Bản volume, cài im lặng từ ISO trong kho bộ cài và tự kích hoạt bằng key MAK
      trong config\office\office2016-standard.xml.
  - id: office2013
    name: Microsoft Office Standard 2013 (64-bit)
    group: Văn phòng
    choice: office
    source: share
    installer: '{share}\SW_DVD5_Office_2013w_SP1_64Bit_English_MLF_X19-34904.ISO'
    args: '/config "{share}\config\office\office2013-standard.xml"'
    detect: { uninstall_name: 'Microsoft Office Standard 2013*' }
    conflicts: 'Microsoft 365*|Microsoft Office 365*|Microsoft Office Home*|Microsoft Office Professional*|Microsoft Office Standard 2016*|Microsoft Office Standard 2010*'
    timeout: 3600
    description: >
      Cho máy cấu hình yếu. Bản volume SP1, cài im lặng từ ISO trong kho bộ cài (key trong
      config\office\office2013-standard.xml).
  - id: office2010
    name: Microsoft Office Standard 2010 (32-bit)
    group: Văn phòng
    choice: office
    source: share
    installer: '{share}\Microsoft Office 2010 Standard Edition X86 SP1.iso'
    args: '/config "{share}\config\office\office2010-standard.xml"'
    detect: { uninstall_name: 'Microsoft Office Standard 2010*' }
    conflicts: 'Microsoft 365*|Microsoft Office 365*|Microsoft Office Home*|Microsoft Office Professional*|Microsoft Office Standard 2016*|Microsoft Office Standard 2013*'
    timeout: 3600
    description: >
      Chỉ khi phần mềm cũ bắt buộc cần bản này (Office 2010 đã hết hỗ trợ từ 2020).
  - id: office365
    name: Microsoft 365 Apps
    group: Văn phòng
    choice: office
    source: winget
    winget_id: Microsoft.Office
    detect: { uninstall_name: 'Microsoft 365*|Microsoft Office 365*' }
    conflicts: 'Microsoft Office Standard 20*|Microsoft Office Professional Plus 20*'
    timeout: 3600
    description: >
      Tải từ Internet (khoảng 3–4GB). Người dùng phải có tài khoản Microsoft 365 trả phí để đăng nhập kích hoạt.
  - id: foxit
    name: Foxit PDF Reader
    group: Văn phòng
    source: winget
    winget_id: Foxit.FoxitReader
  - id: adobe-reader
    name: Adobe Acrobat Reader
    group: Văn phòng
    source: winget
    winget_id: Adobe.Acrobat.Reader.64-bit
    detect: { uninstall_name: 'Adobe Acrobat*' }

  # ---- Gõ tiếng Việt
  - id: unikey
    name: UniKey
    group: Gõ tiếng Việt
    source: share
    type: portable
    path: '{share}\Installers\UniKey'
    exe: UniKeyNT.exe
    autostart: true
    description: >
      Chép thư mục UniKey vào Program Files, tạo shortcut trong Start Menu và cho chạy cùng Windows.

  # ---- Liên lạc và hỗ trợ từ xa
  - id: zalo
    name: Zalo
    group: Liên lạc
    source: winget
    winget_id: VNGCorp.Zalo
    scope: user
    description: >
      Zalo cài vào tài khoản đang chạy bộ cài. Mở tool bằng chính tài khoản của người dùng (bấm Yes ở UAC
      nếu họ là admin) để cài đúng người.
  - id: ultraviewer
    name: UltraViewer
    group: Hỗ trợ từ xa
    source: winget
    winget_id: DucFabulous.UltraViewer
  - id: teamviewer
    name: TeamViewer
    group: Hỗ trợ từ xa
    source: winget
    winget_id: TeamViewer.TeamViewer
  - id: anydesk
    name: AnyDesk
    group: Hỗ trợ từ xa
    source: winget
    winget_id: AnyDesk.AnyDesk

  # ---- Tiện ích
  - id: 7zip
    name: 7-Zip
    group: Tiện ích
    source: winget
    winget_id: 7zip.7zip
  - id: notepadpp
    name: Notepad++
    group: Tiện ích
    source: winget
    winget_id: Notepad++.Notepad++
  - id: vlc
    name: VLC media player
    group: Tiện ích
    source: winget
    winget_id: VideoLAN.VLC

  # ---- Thư viện chạy ứng dụng
  - id: vcredist
    name: Visual C++ Redistributable 2015-2022 (x64)
    group: Thư viện
    source: winget
    winget_id: Microsoft.VCRedist.2015+.x64
    detect: { uninstall_name: 'Microsoft Visual C++ 2015-20* Redistributable (x64)*' }
  - id: dotnet8-desktop
    name: .NET 8 Desktop Runtime
    group: Thư viện
    source: winget
    winget_id: Microsoft.DotNet.DesktopRuntime.8
    detect: { uninstall_name: 'Microsoft Windows Desktop Runtime - 8.*' }

  # ---- Công cụ IT
  - id: putty
    name: PuTTY
    group: Công cụ IT
    source: winget
    winget_id: PuTTY.PuTTY
  - id: winscp
    name: WinSCP
    group: Công cụ IT
    source: winget
    winget_id: WinSCP.WinSCP
  - id: wireshark
    name: Wireshark
    group: Công cụ IT
    source: winget
    winget_id: WiresharkFoundation.Wireshark

  # ---- Công cụ cập nhật driver / BIOS của hãng máy (mục "Cập nhật driver, BIOS của hãng" ở trang Sửa lỗi dùng)
  - id: dell-command-update
    name: Dell Command | Update
    group: Công cụ hãng máy
    source: winget
    winget_id: Dell.CommandUpdate.Universal
    detect: { uninstall_name: 'Dell Command | Update*' }
    description: >
      Chỉ cài trên máy Dell. Cập nhật driver, BIOS, firmware từ Dell.
  - id: lenovo-system-update
    name: Lenovo System Update
    group: Công cụ hãng máy
    source: winget
    winget_id: Lenovo.SystemUpdate
    detect: { uninstall_name: 'Lenovo System Update*' }
    description: >
      Chỉ cài trên máy Lenovo dòng Think (ThinkPad, ThinkCentre, ThinkStation). Cập nhật driver và phần mềm từ Lenovo.

profiles:
  van-phong:
    name: Văn phòng
    apps: [chrome, office2016, foxit, unikey, zalo, ultraviewer, 7zip, vlc, vcredist, dotnet8-desktop]
  ke-toan:
    name: Kế toán
    extends: van-phong
    apps: [adobe-reader]
    description: >
      Thêm phần mềm thuế, hoá đơn, chữ ký số trong danh mục trên share.
  it:
    name: IT
    extends: van-phong
    apps: [notepadpp, putty, winscp, wireshark, anydesk, teamviewer, firefox]
