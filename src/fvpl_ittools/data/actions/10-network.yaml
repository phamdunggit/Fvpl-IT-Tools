# Mạng & Internet. Cách khai báo: xem docs/ACTIONS.md.

- id: net.diagnose
  name: Chẩn đoán mạng
  category: Mạng & Internet
  keywords: ['mất mạng', 'không vào được mạng', 'internet', 'mạng chậm', 'ping', 'dns', 'ip', 'wifi', 'lan', 'ổ chung']
  risk: safe
  admin: false
  description: >
    Chỉ kiểm tra, không đổi gì. Lần lượt xem: card mạng và IP, ping gateway, DNS có tìm được DC không
    (tức DNS có trỏ về DC không), DC có mở các cổng 53/88/389/445 không, giờ máy có lệch DC không,
    và có ra được Internet không. Dòng ✔ là đạt, ✖ là lỗi, ⚠ là cần để ý.
  apply:
    - powershell: |
        $cs = Get-CimInstance Win32_ComputerSystem
        $adapters = @(Get-ActiveAdapters)
        if (-not $adapters) {
            Write-Bad 'Không có card mạng nào đang kết nối và có địa chỉ IPv4.'
            Exit-Checks
        }
        foreach ($adapter in $adapters) {
            Write-Line ('{0} ({1}) | IP {2} | gateway {3} | DNS {4}' -f $adapter.Name, $adapter.Description,
                ($adapter.IPv4 -join ', '), ($adapter.Gateway -join ', '), ($adapter.Dns -join ', '))
            if ($adapter.IPv4 -like '169.254.*') {
                Write-Bad "$($adapter.Name) nhận IP tự cấp 169.254.x.x, tức là không xin được IP từ DHCP."
            }
        }

        $gateways = @($adapters | ForEach-Object { $_.Gateway } | Where-Object { $_ } | Select-Object -Unique)
        if (-not $gateways) { Write-Bad 'Không có default gateway nên máy không ra được ngoài mạng nội bộ.' }
        foreach ($gw in $gateways) {
            if (Test-Ping $gw) { Write-Ok "Ping được gateway $gw" }
            else { Write-Warn "Không ping được gateway $gw (một số router chặn ping, xem tiếp phần Internet bên dưới)" }
        }

        if ($cs.PartOfDomain) {
            $servers = @($adapters | ForEach-Object { $_.Dns } | Where-Object { $_ } | Select-Object -Unique)
            if (Test-DomainDns $cs.Domain $servers) {
                $dc = Find-DomainController $cs.Domain
                if ($dc) { Test-DomainController $dc }
            }
        }
        else {
            Write-Line 'Máy chưa vào domain, bỏ qua phần kiểm tra DC.'
        }

        try {
            [void][System.Net.Dns]::GetHostAddresses('www.microsoft.com')
            Write-Ok 'Phân giải được tên miền Internet (www.microsoft.com)'
            if (Test-Port 'www.microsoft.com' 443 3000) { Write-Ok 'Kết nối được Internet qua HTTPS (cổng 443)' }
            else { Write-Bad 'Không kết nối thẳng được Internet qua cổng 443 (mạng bị chặn hoặc bắt buộc đi qua proxy)' }
        }
        catch { Write-Bad 'Không phân giải được www.microsoft.com, DNS không ra được Internet' }

        $settings = "Registry::HKEY_USERS\$TargetUserSid\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
        $proxy = Get-ItemProperty -LiteralPath $settings -ErrorAction SilentlyContinue
        if ($proxy.ProxyEnable -eq 1 -and $proxy.ProxyServer) { Write-Warn "Người dùng đang đặt proxy $($proxy.ProxyServer)" }
        if ($proxy.AutoConfigURL) { Write-Warn "Người dùng đang dùng file cấu hình proxy $($proxy.AutoConfigURL)" }
        Exit-Checks
      timeout: 180
      messages:
        2: Có mục kiểm tra không đạt, xem các dòng ✖ ở trên

- id: net.flush_dns
  name: Xoá cache DNS
  category: Mạng & Internet
  keywords: ['dns', 'flushdns', 'không vào được trang web', 'web lỗi']
  risk: safe
  description: >
    Xoá bộ nhớ đệm phân giải tên miền. Dùng khi vào web hoặc ổ mạng bị trỏ sai
    địa chỉ, ví dụ sau khi đổi IP server hay đổi bản ghi DNS.
  apply:
    - cmd: ipconfig /flushdns

- id: net.renew_ip
  name: Xin lại IP
  category: Mạng & Internet
  keywords: ['ip', 'dhcp', 'ipconfig', 'renew', '169.254', 'mất mạng']
  risk: safe
  description: >
    Trả IP rồi xin IP mới từ DHCP cho các card mạng thật đang kết nối (bỏ qua card ảo, VPN và
    card đặt IP tĩnh). Mạng sẽ mất vài giây. Dùng khi máy nhận IP 169.254.x.x hoặc IP sai dải.
  apply:
    - powershell: |
        $dhcp = @(Get-ActiveAdapters | Where-Object { $_.Physical -and $_.Dhcp } | ForEach-Object Name)
        if (-not $dhcp) {
            Write-Output 'Không có card mạng đang kết nối nào dùng DHCP (máy đặt IP tĩnh?), không cần xin lại IP.'
            exit 0
        }
        $failed = 0
        foreach ($name in $dhcp) {
            Write-Output "Xin lại IP cho $name…"
            ipconfig /release $name | Out-Null
            ipconfig /renew $name
            if ($LASTEXITCODE) { $failed++ }
        }
        if ($failed) { exit 2 }
      timeout: 180
      messages:
        2: Không xin được IP từ DHCP cho một số card mạng

- id: net.reset_proxy
  name: Xoá proxy của người dùng
  category: Mạng & Internet
  keywords: ['proxy', 'không vào được web', 'trình duyệt', 'internet options']
  risk: safe
  scope: user
  admin: false
  description: >
    Tắt proxy và bỏ file cấu hình proxy (PAC) trong Internet Options của người dùng, đưa về
    "Tự nhận thiết lập". Dùng khi trình duyệt báo lỗi proxy, thường do phần mềm lạ hoặc VPN cũ để lại.
    Nếu công ty đặt proxy bằng GPO thì mục này bị khoá; GPO sẽ áp lại proxy ở lần gpupdate sau.
  gpo:
    - { key: 'HKCU\Software\Policies\Microsoft\Internet Explorer\Control Panel', name: Proxy }
    - { key: 'HKLM\Software\Policies\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxySettingsPerUser }
  apply:
    - registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxyEnable, type: DWORD, value: 0 }
    - registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxyServer, delete: true }
    - registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings', name: AutoConfigURL, delete: true }
    # Bản lưu nhị phân của thiết lập proxy. Xoá đi thì Windows tạo lại theo mặc định.
    - registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Connections', name: DefaultConnectionSettings, delete: true }
    - registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Connections', name: SavedLegacySettings, delete: true }
  undo: auto

- id: net.reset_winhttp_proxy
  name: Xoá proxy hệ thống (WinHTTP)
  category: Mạng & Internet
  keywords: ['proxy', 'winhttp', 'netsh', 'windows update không tải được']
  risk: safe
  description: >
    Xoá proxy mà các dịch vụ Windows dùng (Windows Update, Defender, Office cập nhật...), khác với proxy
    trong trình duyệt. Proxy cũ được in ra log trước khi xoá, cần đặt lại thì dùng
    netsh winhttp set proxy <proxy>.
  apply:
    - cmd: netsh winhttp show proxy
    - cmd: netsh winhttp reset proxy

- id: net.restart_adapters
  name: Khởi động lại card mạng
  category: Mạng & Internet
  keywords: ['card mạng', 'wifi', 'lan', 'mất mạng', 'adapter']
  risk: safe
  description: >
    Tắt rồi bật lại các card mạng thật (LAN, Wi-Fi), bỏ qua card đang bị tắt có chủ ý. Mạng mất
    khoảng 5–10 giây, Wi-Fi tự kết nối lại. Dùng khi card mạng "Connected" mà không vào được mạng.
  apply:
    - powershell: |
        # Card thật đang bật (kể cả chưa cắm dây). Dùng WMI thay cho Restart-NetAdapter vì module đó nạp rất chậm.
        $adapters = @(Get-CimInstance Win32_NetworkAdapter -Filter 'NetEnabled = True' |
            Where-Object { $_.PhysicalAdapter -and $_.PNPDeviceID -notmatch '^(ROOT|SWD)\\' })
        if (-not $adapters) { Write-Output 'Không có card mạng nào đang bật.'; exit 0 }
        $failed = 0
        foreach ($adapter in $adapters) {
            Write-Output "Khởi động lại $($adapter.NetConnectionID) ($($adapter.Name))…"
            $off = Invoke-CimMethod -InputObject $adapter -MethodName Disable
            Start-Sleep -Seconds 2
            # Bật lại, thử tối đa 3 lần: card tắt mà không bật lại được thì máy mất mạng.
            for ($try = 1; $try -le 3; $try++) {
                $on = Invoke-CimMethod -InputObject $adapter -MethodName Enable
                if ($on.ReturnValue -eq 0) { break }
                Start-Sleep -Seconds 2
            }
            if ($off.ReturnValue -ne 0 -or $on.ReturnValue -ne 0) {
                Write-Output "⚠ $($adapter.NetConnectionID): tắt trả mã $($off.ReturnValue), bật trả mã $($on.ReturnValue)"
                $failed++
            }
        }
        if ($failed) { exit 2 }
      timeout: 120
      messages:
        2: Có card mạng không khởi động lại được, kiểm tra trong Network Connections

- id: net.reset_winsock
  name: Reset Winsock và TCP/IP
  category: Mạng & Internet
  keywords: ['winsock', 'tcpip', 'netsh', 'mất mạng', 'mạng lỗi']
  risk: caution
  reboot: true
  description: >
    Đưa Winsock và TCP/IP về mặc định. Dùng khi các cách khác không được: có IP mà không vào được
    mạng, lỗi sau khi gỡ VPN hoặc phần mềm diệt virus. Card đặt IP tĩnh sẽ trở về DHCP:
    cấu hình hiện tại được in ra log trước để đặt lại. Cần khởi động lại máy.
  apply:
    - cmd: ipconfig /all
    - cmd: netsh winsock reset
    # Thường in vài dòng "Access is denied" cho khoá chỉ SYSTEM mới đổi được và trả mã 1,
    # phần còn lại vẫn reset xong (xem docs/HANDOFF.md, phần chưa kiểm chứng).
    - cmd: netsh int ip reset
      ok_codes: [0, 1]
  undo: none

- id: net.restore_hosts
  name: Khôi phục file hosts mặc định
  category: Mạng & Internet
  keywords: ['hosts', 'chặn web', 'không vào được trang']
  risk: caution
  description: >
    Sao lưu file hosts hiện tại (hosts.fvpl-<thời gian>.bak cùng thư mục) rồi đưa về nội dung mặc định của Windows.
    Dùng khi web bị chuyển hướng lạ, phần mềm bẻ khoá hoặc mã độc chặn trang cập nhật. Các dòng đang có hiệu lực
    được in ra log trước khi xoá. Hoàn tác trả lại bản sao lưu gần nhất.
  apply:
    - powershell: |
        $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
        if (Test-Path -LiteralPath $hosts) {
            $active = @(Get-Content -LiteralPath $hosts | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') })
            if ($active) { Write-Output 'Các dòng đang có hiệu lực:'; $active | ForEach-Object { Write-Output "    $_" } }
            else { Write-Output 'File hosts không có dòng nào có hiệu lực.' }
            $backup = '{0}.fvpl-{1:yyyyMMdd-HHmmss}.bak' -f $hosts, (Get-Date)
            Copy-Item -LiteralPath $hosts -Destination $backup -Force
            Write-Output "Đã sao lưu: $backup"
        }
        $default = @(
            '# Copyright (c) 1993-2009 Microsoft Corp.',
            '#',
            '# This is a sample HOSTS file used by Microsoft TCP/IP for Windows.',
            '#',
            '# localhost name resolution is handled within DNS itself.',
            '#	127.0.0.1       localhost',
            '#	::1             localhost'
        )
        Set-Content -LiteralPath $hosts -Value $default -Encoding ASCII
        ipconfig /flushdns | Out-Null
        Write-Output '✔ Đã đưa file hosts về mặc định và xoá cache DNS.'
  undo:
    - powershell: |
        $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
        $latest = Get-ChildItem -LiteralPath (Split-Path -Parent $hosts) -Filter 'hosts.fvpl-*.bak' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $latest) { exit 3 }
        Copy-Item -LiteralPath $latest.FullName -Destination $hosts -Force
        ipconfig /flushdns | Out-Null
        Write-Output "✔ Đã trả lại file hosts từ $($latest.Name)."
      messages:
        3: Không thấy bản sao lưu hosts.fvpl-*.bak nào

- id: net.reset_firewall
  name: Reset Windows Firewall
  category: Mạng & Internet
  keywords: ['firewall', 'tường lửa', 'chặn kết nối']
  risk: caution
  description: >
    Sao lưu cấu hình firewall ra file .wfw trong thư mục reports của tool, rồi đưa firewall về mặc định (bỏ mọi luật
    tự thêm). Dùng khi phần mềm thêm luật chặn lung tung. Máy trong domain sẽ nhận lại luật của GPO ở lần gpupdate
    sau. Hoàn tác nạp lại bản sao lưu gần nhất.
  apply:
    - powershell: |
        $file = Join-Path $ReportDir ('firewall_{0:yyyyMMdd_HHmmss}.wfw' -f (Get-Date))
        netsh advfirewall export $file
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Write-Output "Đã sao lưu cấu hình firewall: $file"
        netsh advfirewall reset
  undo:
    - powershell: |
        $latest = Get-ChildItem -LiteralPath $ReportDir -Filter 'firewall_*.wfw' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $latest) { exit 3 }
        netsh advfirewall import $latest.FullName
      messages:
        3: Không thấy bản sao lưu firewall_*.wfw nào trong thư mục reports
