# Hệ thống. Cách khai báo: xem docs/ACTIONS.md.

- id: sys.sfc_dism
  name: Quét và sửa file hệ thống (DISM + SFC)
  category: Hệ thống
  keywords: ['sfc', 'dism', 'file hệ thống', 'windows lỗi', 'scannow', 'hỏng file']
  risk: safe
  description: >
    Sửa kho thành phần Windows bằng DISM /RestoreHealth (tải file sạch từ Windows Update), rồi chạy
    sfc /scannow để thay file hệ thống hỏng. Mất 10–40 phút, máy vẫn dùng được trong lúc chạy.
    Dùng khi Windows lỗi lạ, Start/Settings không mở, cập nhật lỗi liên tục. Kết luận của SFC nằm ở
    dòng cuối trong log; chi tiết ở C:\Windows\Logs\CBS\CBS.log.
  apply:
    - cmd: DISM /Online /Cleanup-Image /RestoreHealth
      timeout: 3600
      messages:
        0x800F081F: DISM không tìm được nguồn file sạch. Máy dùng WSUS thường bị lỗi này, cần nguồn install.wim cùng bản Windows
        0x800F0906: DISM không tải được file từ Windows Update, kiểm tra Internet hoặc proxy
        0x800F0907: GPO đang chặn DISM tải file từ Windows Update
    - cmd: sfc /scannow
      timeout: 3600

- id: sys.chkdsk_scan
  name: Kiểm tra ổ đĩa hệ thống
  category: Hệ thống
  keywords: ['chkdsk', 'ổ đĩa', 'ổ cứng', 'bad sector', 'kiểm tra ổ']
  risk: safe
  description: >
    Chạy chkdsk /scan trên ổ hệ thống khi Windows đang chạy, không cần khởi động lại, không khoá ổ.
    Nếu thấy lỗi thì chạy mục "Hẹn sửa ổ đĩa khi khởi động lại".
  apply:
    - cmd: chkdsk %SystemDrive% /scan
      timeout: 3600
      ok_codes: [0, 1, 2]
      messages:
        3: Ổ đĩa có lỗi chưa sửa được khi Windows đang chạy. Chạy mục Hẹn sửa ổ đĩa khi khởi động lại

- id: sys.chkdsk_schedule
  name: Hẹn sửa ổ đĩa khi khởi động lại
  category: Hệ thống
  keywords: ['chkdsk', 'ổ đĩa', 'sửa ổ', 'ntfs', 'bad sector']
  risk: caution
  reboot: true
  description: >
    Đánh dấu ổ hệ thống để lần khởi động tới Windows chạy chkdsk /f sửa lỗi trước khi vào màn hình
    đăng nhập. Mất từ vài phút đến hơn một giờ tuỳ ổ đĩa; không được tắt máy giữa chừng.
    Muốn huỷ trước khi khởi động lại thì chạy chkntfs /x %SystemDrive%.
  apply:
    - cmd: fsutil dirty set %SystemDrive%
    - cmd: fsutil dirty query %SystemDrive%
  undo: none

- id: sys.restart_explorer
  name: Khởi động lại Explorer
  category: Hệ thống
  keywords: ['explorer', 'taskbar', 'thanh tác vụ', 'màn hình treo', 'desktop']
  risk: safe
  admin: false
  description: >
    Tắt và mở lại Explorer (taskbar, desktop, cửa sổ thư mục). Dùng khi taskbar bị treo,
    icon không hiện, Start không bấm được. Các cửa sổ thư mục đang mở sẽ bị đóng.
  apply:
    - builtin: restart_explorer

- id: sys.rebuild_icon_cache
  name: Xây lại cache icon và thumbnail
  category: Hệ thống
  keywords: ['icon', 'biểu tượng', 'thumbnail', 'ảnh thu nhỏ', 'icon trắng']
  risk: safe
  scope: user
  admin: false
  description: >
    Xoá cache icon và ảnh thu nhỏ của người đang đăng nhập rồi mở lại Explorer, Windows tự tạo lại cache.
    Dùng khi icon trên desktop/taskbar bị trắng, sai hình, hoặc ảnh thu nhỏ không hiện.
    Các cửa sổ thư mục đang mở sẽ bị đóng; icon có thể hiện chậm trong vài phút đầu.
  apply:
    - builtin: rebuild_icon_cache

- id: sys.fix_audio
  name: Sửa mất âm thanh
  category: Hệ thống
  keywords: ['âm thanh', 'loa', 'mất tiếng', 'audio', 'sound', 'tai nghe']
  risk: safe
  description: >
    Khởi động lại hai dịch vụ âm thanh của Windows (Audio Endpoint Builder và Windows Audio).
    Dùng khi biểu tượng loa có dấu X, báo "No audio output device is installed" dù thiết bị vẫn cắm.
  apply:
    - service: { name: AudioEndpointBuilder, action: restart }
    - service: { name: Audiosrv, action: start }

- id: sys.device_errors
  name: Liệt kê thiết bị lỗi
  category: Hệ thống
  keywords: ['driver', 'thiết bị lỗi', 'device manager', 'dấu chấm than', 'phần cứng']
  risk: safe
  admin: false
  description: >
    Chỉ xem: thiết bị có dấu chấm than vàng trong Device Manager, kèm mã lỗi và ý nghĩa (chưa có driver, bị tắt,
    không khởi động được…). Mã PNPDeviceID dùng để tìm driver đúng trên trang của hãng.
  apply:
    - powershell: |
        $meanings = @{
            1 = 'cấu hình sai'; 3 = 'driver hỏng hoặc thiếu bộ nhớ'; 10 = 'không khởi động được'; 12 = 'xung đột tài nguyên'
            14 = 'cần khởi động lại'; 18 = 'cần cài lại driver'; 19 = 'thông tin cấu hình trong registry hỏng'
            22 = 'đang bị tắt'; 24 = 'thiết bị không có mặt hoặc thiếu driver'; 28 = 'chưa cài driver'
            31 = 'driver không tải được'; 39 = 'driver hỏng hoặc thiếu'; 43 = 'Windows dừng thiết bị vì báo lỗi'
            45 = 'thiết bị đang không cắm'; 52 = 'driver không có chữ ký số hợp lệ'
        }
        $devices = @(Get-CimInstance Win32_PnPEntity -Filter 'ConfigManagerErrorCode <> 0')
        if (-not $devices) { Write-Ok 'Không có thiết bị nào báo lỗi.'; exit 0 }
        foreach ($device in $devices) {
            $code = [int]$device.ConfigManagerErrorCode
            $meaning = if ($meanings.ContainsKey($code)) { $meanings[$code] } else { 'xem mã trong Device Manager' }
            Write-Warn ('{0} | mã {1}: {2} | {3}' -f $device.Name, $code, $meaning, $device.PNPDeviceID)
        }
      timeout: 120

- id: sys.scan_devices
  name: Quét lại phần cứng
  category: Hệ thống
  keywords: ['driver', 'thiết bị', 'usb', 'phần cứng', 'không nhận thiết bị']
  risk: safe
  os: { min_build: 19041 }
  description: >
    Như bấm "Scan for hardware changes" trong Device Manager: Windows dò lại thiết bị và cài driver có sẵn. Dùng sau
    khi cắm thiết bị mà không nhận, hoặc sau khi chép driver vào máy.
  apply:
    - cmd: pnputil /scan-devices

- id: sys.repair_wmi
  name: Sửa WMI
  category: Hệ thống
  keywords: ['wmi', 'winmgmt', 'thông tin máy lỗi']
  risk: caution
  description: >
    Kiểm tra kho WMI và tự dựng lại nếu hỏng (winmgmt /salvagerepository). Dùng khi trang Tổng quan, phần mềm quản
    lý, GPO lọc theo WMI báo lỗi "Invalid class", "Provider load failure". Không xoá dữ liệu của phần mềm khác.
  apply:
    - powershell: |
        winmgmt /verifyrepository
        Write-Output "(kiểm tra trả mã $LASTEXITCODE)"
        winmgmt /salvagerepository
  undo: none

- id: sys.repair_msi
  name: Sửa Windows Installer
  category: Hệ thống
  keywords: ['windows installer', 'msi', 'không cài được phần mềm', '1603', '1618']
  risk: caution
  description: >
    Đăng ký lại dịch vụ Windows Installer (msiexec /unregister rồi /regserver). Dùng khi cài hoặc gỡ phần mềm .msi
    báo "The Windows Installer service could not be accessed" hoặc lỗi 1601, 1719.
  apply:
    - powershell: |
        Stop-Service -Name msiserver -Force -ErrorAction SilentlyContinue
        $msiexec = Join-Path $env:SystemRoot 'System32\msiexec.exe'
        foreach ($argument in '/unregister', '/regserver') {
            $process = Start-Process -FilePath $msiexec -ArgumentList $argument -PassThru
            $null = $process.Handle
            $process.WaitForExit()
            Write-Output "msiexec $($argument): mã $($process.ExitCode)"
            if ($process.ExitCode) { exit $process.ExitCode }
        }
        Start-Service -Name msiserver
  undo: none

- id: sys.reregister_shell
  name: Sửa Start, Search, Settings không mở
  category: Hệ thống
  keywords: ['start', 'search', 'settings', 'menu start không mở', 'tìm kiếm không mở']
  risk: advanced
  admin: false
  description: >
    Đăng ký lại các ứng dụng hệ thống của Start menu, ô tìm kiếm và Settings cho tài khoản bị lỗi. Phải mở tool bằng
    chính tài khoản đó (đăng ký ứng dụng chỉ áp cho tài khoản đang chạy). Nên chạy "Quét và sửa file hệ thống"
    trước. Explorer sẽ được khởi động lại.
  apply:
    - powershell: |
        if ([Security.Principal.WindowsIdentity]::GetCurrent().User.Value -ne $TargetUserSid) { exit 4 }
        $names = 'Microsoft.Windows.ShellExperienceHost', 'Microsoft.Windows.StartMenuExperienceHost',
            'Microsoft.Windows.Search', 'MicrosoftWindows.Client.CBS', 'windows.immersivecontrolpanel'
        $failed = 0
        foreach ($name in $names) {
            foreach ($package in @(Get-AppxPackage -Name $name)) {
                Write-Output "Đăng ký lại $($package.Name)…"
                try {
                    Add-AppxPackage -DisableDevelopmentMode -Register (Join-Path $package.InstallLocation 'AppxManifest.xml') -ErrorAction Stop
                }
                catch { Write-Output "⚠ $($package.Name): $($_.Exception.Message)"; $failed++ }
            }
        }
        if ($failed) { exit 2 }
      timeout: 600
      messages:
        2: Có ứng dụng không đăng ký lại được, xem các dòng ⚠ ở trên
        4: Tool đang chạy bằng tài khoản khác người đang đăng nhập; mở tool bằng chính tài khoản bị lỗi
  undo: none
  after: [restart_explorer]
