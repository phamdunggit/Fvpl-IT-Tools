# Office. Cách khai báo: xem docs/ACTIONS.md.
#
# Hai mục dưới chỉ dùng được với Office bản Click-to-Run (Microsoft 365, Office 2016 trở lên cài bằng ODT).
# OfficeClickToRun.exe giao việc sửa cho dịch vụ Click-to-Run rồi thoát ngay, nên mã thoát 0 chỉ có nghĩa
# là đã gửi lệnh sửa; Office tiếp tục sửa ngầm vài phút sau đó.

- id: off.quick_repair
  name: Sửa Office nhanh (Quick Repair)
  category: Office
  keywords: ['office', 'word', 'excel', 'outlook', 'sửa office', 'office lỗi', 'treo']
  risk: safe
  description: >
    Sửa Office không cần Internet, khoảng 5–10 phút. Dùng khi Word/Excel/Outlook mở lên bị treo,
    báo lỗi khi mở, mất nút hay add-in lạ. Tool không chạy nếu còn ứng dụng Office đang mở, để không
    mất bài người dùng chưa lưu.
  apply:
    - powershell: |
        $config = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' -ErrorAction SilentlyContinue
        if (-not $config) { exit 3 }
        $open = @(Get-Process -Name WINWORD, EXCEL, POWERPNT, OUTLOOK, MSACCESS, MSPUB, ONENOTE, VISIO, WINPROJ, lync -ErrorAction SilentlyContinue)
        if ($open) {
            Write-Output ('Đang mở: ' + (($open | ForEach-Object ProcessName | Select-Object -Unique) -join ', '))
            exit 4
        }
        $folder = $config.ClientFolder
        if (-not $folder) { $folder = Join-Path $env:CommonProgramFiles 'microsoft shared\ClickToRun' }
        $client = Join-Path $folder 'OfficeClickToRun.exe'
        Write-Output "Office $($config.VersionToReport), bản $($config.Platform), ngôn ngữ $($config.ClientCulture)"
        & $client scenario=Repair "platform=$($config.Platform)" "culture=$($config.ClientCulture)" RepairType=QuickRepair DisplayLevel=False
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Write-Output 'Đã gửi lệnh sửa. Office sửa ngầm khoảng 5–10 phút, chưa mở lại Office trong lúc này.'
      timeout: 300
      messages:
        3: Máy không có Office bản Click-to-Run. Office cài bằng MSI thì sửa trong Programs and Features, chọn Change rồi Repair
        4: Hãy lưu bài và đóng các ứng dụng Office rồi chạy lại

- id: off.online_repair
  name: Sửa Office trực tuyến (Online Repair)
  category: Office
  keywords: ['office', 'word', 'excel', 'outlook', 'sửa office', 'cài lại office']
  risk: caution
  description: >
    Gỡ rồi cài lại Office từ Internet, giữ nguyên bản và license. Lâu hơn (20–60 phút, tải khoảng 3–4GB)
    và cần Internet. Chỉ dùng khi Quick Repair không được. Tool không chạy nếu còn ứng dụng Office đang mở.
    Sau khi xong người dùng có thể phải đăng nhập lại Office.
  apply:
    - powershell: |
        $config = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' -ErrorAction SilentlyContinue
        if (-not $config) { exit 3 }
        $open = @(Get-Process -Name WINWORD, EXCEL, POWERPNT, OUTLOOK, MSACCESS, MSPUB, ONENOTE, VISIO, WINPROJ, lync -ErrorAction SilentlyContinue)
        if ($open) {
            Write-Output ('Đang mở: ' + (($open | ForEach-Object ProcessName | Select-Object -Unique) -join ', '))
            exit 4
        }
        $folder = $config.ClientFolder
        if (-not $folder) { $folder = Join-Path $env:CommonProgramFiles 'microsoft shared\ClickToRun' }
        $client = Join-Path $folder 'OfficeClickToRun.exe'
        Write-Output "Office $($config.VersionToReport), bản $($config.Platform), ngôn ngữ $($config.ClientCulture)"
        & $client scenario=Repair "platform=$($config.Platform)" "culture=$($config.ClientCulture)" RepairType=FullRepair DisplayLevel=False
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Write-Output 'Đã gửi lệnh sửa. Office gỡ và cài lại ngầm, mất 20–60 phút. Biểu tượng Office sẽ biến mất rồi hiện lại.'
      timeout: 300
      messages:
        3: Máy không có Office bản Click-to-Run. Office cài bằng MSI thì sửa trong Programs and Features, chọn Change rồi Repair
        4: Hãy lưu bài và đóng các ứng dụng Office rồi chạy lại
  undo: none

- id: off.update
  name: Cập nhật Office
  category: Office
  keywords: ['office', 'cập nhật office', 'update']
  risk: safe
  description: >
    Yêu cầu Office Click-to-Run kiểm tra và cài bản cập nhật mới theo kênh đang dùng. Office tải và cài ngầm; ứng
    dụng Office đang mở thì việc cài chờ tới khi người dùng đóng. Máy cập nhật Office qua WSUS/SCCM thì làm theo
    nguồn đó.
  apply:
    - powershell: |
        $config = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' -ErrorAction SilentlyContinue
        if (-not $config) { exit 3 }
        $folder = $config.ClientFolder
        if (-not $folder) { $folder = Join-Path $env:CommonProgramFiles 'microsoft shared\ClickToRun' }
        Write-Output "Office hiện tại: $($config.VersionToReport)"
        & (Join-Path $folder 'OfficeC2RClient.exe') /update user displaylevel=false forceappshutdown=false
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Write-Output 'Đã gửi lệnh cập nhật, Office tải và cài ngầm.'
      timeout: 300
      messages:
        3: Máy không có Office bản Click-to-Run

- id: off.teams_cache
  name: Xoá cache Teams
  basic_name: 'Sửa Teams trắng màn hình, không đăng nhập được (xoá cache)'
  category: Office
  keywords: ['teams', 'cache', 'teams trắng', 'không đăng nhập teams']
  risk: safe
  scope: user
  admin: false
  description: >
    Tắt Teams của người đang đăng nhập rồi xoá cache (Teams mới và Teams cũ). Dùng khi Teams trắng màn hình, không
    đăng nhập được, không hiện tin nhắn mới. Không mất tin nhắn hay file; mở lại Teams sẽ chậm hơn lần đầu.
  apply:
    - powershell: |
        if (-not $TargetUserProfile) { exit 3 }
        $session = (Get-Process -Id $PID).SessionId
        Get-Process -Name ms-teams, Teams -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session |
            Stop-Process -Force
        Start-Sleep -Seconds 2
        $folders = @(
            (Join-Path $TargetUserProfile 'AppData\Local\Packages\MSTeams_8wekyb3d8bbwe\LocalCache\Microsoft\MSTeams'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\Cache'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\blob_storage'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\databases'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\GPUCache'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\IndexedDB'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\Local Storage'),
            (Join-Path $TargetUserProfile 'AppData\Roaming\Microsoft\Teams\tmp')
        )
        $cleaned = 0
        foreach ($folder in $folders) {
            if (-not (Test-Path -LiteralPath $folder)) { continue }
            Get-ChildItem -LiteralPath $folder -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output "Đã xoá cache: $folder"
            $cleaned++
        }
        if (-not $cleaned) { Write-Output 'Không thấy thư mục cache Teams nào.' }
      timeout: 300
      messages:
        3: Không tìm thấy thư mục profile của người dùng

# ---- Office bản volume (2010 / 2013 / 2016 cài từ ISO ở trang Phần mềm). Hướng dẫn: docs/HUONG-DAN-SU-DUNG.md.

- id: off.remove_c2r
  name: Gỡ Microsoft 365 / Office cài sẵn (Click-to-Run)
  category: Office
  keywords: ['microsoft 365', 'office 365', 'gỡ office', 'click-to-run', 'c2r', 'office cài sẵn']
  risk: caution
  undo: none
  description: >
    Máy Dell, Lenovo mới hay có sẵn Microsoft 365 / Office bản dùng thử (Click-to-Run). Office 2010 / 2013 / 2016 bản
    volume không cài chung được với nó (trang Phần mềm báo "Không cài được: máy đang có Microsoft 365…"). Mục này gỡ
    im lặng mọi Office Click-to-Run trên máy, kể cả Office 2019 / 2021 / 365 đang dùng thật, rồi chờ tới khi gỡ xong
    (có thể 5–15 phút). Đóng các ứng dụng Office trước khi chạy.
  apply:
    - powershell: |
        $open = @(Get-Process -Name WINWORD, EXCEL, POWERPNT, OUTLOOK, MSACCESS, MSPUB, ONENOTE, VISIO, WINPROJ, lync -ErrorAction SilentlyContinue)
        if ($open) {
            Write-Output ('Đang mở: ' + (($open | ForEach-Object ProcessName | Select-Object -Unique) -join ', '))
            exit 4
        }
        $roots = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
        $products = @(foreach ($root in $roots) {
            Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue | ForEach-Object {
                $item = Get-ItemProperty -LiteralPath $_.PSPath
                $command = [string]$item.UninstallString
                if ($command -match 'OfficeClickToRun\.exe' -and $command -match 'productstoremove=') { $item }
            }
        })
        if (-not $products) { Write-Output 'Máy không có Office / Microsoft 365 bản Click-to-Run, không cần gỡ.'; exit 0 }
        foreach ($product in $products) {
            if ([string]$product.UninstallString -notmatch '^\s*"([^"]+)"\s*(.*)$') {
                Write-Output ('Không đọc được lệnh gỡ của {0}.' -f $product.DisplayName)
                exit 5
            }
            $client = $Matches[1]
            $arguments = $Matches[2] + ' DisplayLevel=False'
            Write-Output ('Gỡ {0}…' -f $product.DisplayName)
            $process = Start-Process -FilePath $client -ArgumentList $arguments -PassThru
            $null = $process.Handle
            $process.WaitForExit()
            # OfficeClickToRun.exe giao việc cho dịch vụ rồi thoát: chờ tới khi mục gỡ cài đặt biến mất (tối đa 30 phút).
            $deadline = (Get-Date).AddMinutes(30)
            while ((Test-Path -LiteralPath $product.PSPath) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 10 }
            if (Test-Path -LiteralPath $product.PSPath) { Write-Output ('Sau 30 phút vẫn chưa gỡ xong {0}.' -f $product.DisplayName); exit 6 }
            Write-Output ('Đã gỡ {0}.' -f $product.DisplayName)
        }
        Write-Output 'Xong. Khởi động lại máy trước khi cài Office bản volume.'
        exit 10
      timeout: 2400
      reboot_codes: [10]
      messages:
        4: Hãy lưu bài và đóng các ứng dụng Office rồi chạy lại
        5: Không đọc được lệnh gỡ trong Programs and Features, gỡ bằng tay trong Settings > Apps
        6: Office chưa gỡ xong, xem Settings > Apps hoặc chạy lại

- id: off.activate_volume
  name: Kích hoạt Office bản volume (MAK) và xem trạng thái
  category: Office
  keywords: ['kích hoạt office', 'office', 'mak', 'ospp', 'active office', 'bản quyền office']
  risk: safe
  description: >
    Dùng sau khi cài Office 2010 / 2013 / 2016 bản volume ở trang Phần mềm (key MAK điền sẵn trong file XML của kho
    bộ cài). Chạy ospp.vbs /act để kích hoạt qua Internet, rồi hiện trạng thái kích hoạt từng sản phẩm Office. Máy
    không có Internet thì kích hoạt sau, hoặc kích hoạt qua điện thoại (ospp.vbs /dinstid). Office Microsoft 365
    kích hoạt bằng tài khoản người dùng, không dùng mục này.
  apply:
    - powershell: |
        $scripts = @()
        foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if (-not $root) { continue }
            foreach ($version in 'Office16', 'Office15', 'Office14') {
                $path = Join-Path $root ('Microsoft Office\{0}\OSPP.VBS' -f $version)
                if (Test-Path -LiteralPath $path) { $scripts += $path }
            }
        }
        if (-not $scripts) {
            Write-Bad 'Không thấy OSPP.VBS: máy chưa cài Office bản volume 2010 / 2013 / 2016.'
            exit 3
        }
        foreach ($ospp in $scripts) {
            Write-Line ('Kích hoạt bằng {0}' -f $ospp)
            $output = & cscript.exe //nologo $ospp /act
            foreach ($line in @($output)) { if ("$line".Trim() -and "$line" -notmatch '^-+$') { Write-Line ('    ' + "$line".Trim()) } }
        }
        $products = @()
        try { $products += @(Get-CimInstance SoftwareLicensingProduct -ErrorAction Stop -Filter "ApplicationID='0ff1ce15-a989-479d-af46-f275c6370663' AND PartialProductKey IS NOT NULL") } catch { }
        try { $products += @(Get-CimInstance OfficeSoftwareProtectionProduct -ErrorAction Stop -Filter "ApplicationID='59a52881-a989-479d-af46-f275c6370663' AND PartialProductKey IS NOT NULL") } catch { }
        if (-not $products) { Write-Bad 'Không thấy key Office nào: điền key MAK vào file XML trong kho bộ cài rồi cài lại, hoặc nhập key bằng ospp.vbs /inpkey:<key>.' }
        $labels = @{ 0 = 'CHƯA kích hoạt'; 1 = 'đã kích hoạt'; 2 = 'đang dùng thử, CHƯA kích hoạt'; 3 = 'hết hạn, đang ân hạn'; 4 = 'không chính hãng'; 5 = 'cần kích hoạt lại'; 6 = 'ân hạn mở rộng' }
        foreach ($product in $products) {
            $text = '{0} (key …{1}): {2}' -f $product.Name, $product.PartialProductKey, $labels[[int]$product.LicenseStatus]
            if ([int]$product.LicenseStatus -eq 1) { Write-Ok $text } else { Write-Bad $text }
        }
        Exit-Checks
      timeout: 300
      messages:
        2: Office chưa kích hoạt được, xem các dòng ✖ ở trên (cần Internet; key MAK có thể đã hết lượt)
        3: Máy chưa cài Office bản volume
