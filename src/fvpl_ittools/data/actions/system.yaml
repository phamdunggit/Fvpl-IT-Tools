# Hệ thống. Cách khai báo: xem PLAN.md mục 6.3.

- id: sys.restart_explorer
  name: Khởi động lại Explorer
  category: Hệ thống
  page: fixes
  risk: safe
  admin: false
  description: >
    Tắt và mở lại Explorer (taskbar, desktop, cửa sổ thư mục). Dùng khi taskbar bị treo,
    icon không hiện, Start không bấm được. Các cửa sổ thư mục đang mở sẽ bị đóng.
  apply:
    - builtin: restart_explorer
