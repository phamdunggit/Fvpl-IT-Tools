# Mẫu cấu hình riêng của công ty.
# Sao chép thành site.yaml, đặt cạnh file exe (hoặc trong %ProgramData%\FVPL-ITTools\),
# rồi điền thông tin thật. site.yaml KHÔNG được commit vì repo để public.

# Tên domain Active Directory (FQDN)
domain: corp.example

# Tên domain kiểu cũ (NetBIOS), dùng cho tài khoản dạng DOMAIN\user
netbios_domain: CORP

# Thư mục share chứa bộ cài và config dùng chung (kho bộ cài của bản USB). Bản SSD dùng thư mục SOFT
# cạnh file exe thay cho share, cùng cấu trúc. Cấu trúc tool đọc:
#   config\apps.yaml          danh mục phần mềm và profile (docs/SOFTWARE.md)
#   Installers\...            bộ cài phần mềm nguồn share (đường dẫn khai báo trong apps.yaml)
#   Installers\winget\        App Installer (.msixbundle, .appx phụ thuộc, license .xml) để cài lại winget
#   Sources\sxs\<build>\      nguồn .NET 3.5 offline, chép từ sources\sxs của ISO cùng build (ví dụ 26100)
share_root: '\\fileserver.corp.example\IT$\ITTools'

# Tiền tố tên máy, ví dụ FVPL- cho FVPL-KT05
computer_prefix: FVPL-
